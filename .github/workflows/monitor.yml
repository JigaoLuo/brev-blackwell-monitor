name: Blackwell monitor

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/monitor.yml"
      - "scripts/**"
      - "tests/**"

permissions:
  contents: read
  issues: write

concurrency:
  group: blackwell-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Check Brev and notify
        env:
          BREV_API_KEY: ${{ secrets.BREV_API_KEY }}
          BREV_API_KEY_EXPIRES_ON: ${{ vars.BREV_API_KEY_EXPIRES_ON }}
          NOTIFY_USER: ${{ vars.NOTIFY_USER || github.repository_owner }}
          # Auto-start is on by default; set the variable to 0 to disable it.
          BREV_AUTOSTART: ${{ vars.BREV_AUTOSTART || '1' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/monitor.py
